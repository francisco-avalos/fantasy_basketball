# The nightly data refresh, on GitHub's servers: python -m pipeline.run_scripts --list small
# (every ETL script, the injury chain, then points_forecast), against the RDS database.
#
# Needs (repo Settings -> Secrets and variables -> Actions):
#   secrets    SPORTS_DB_ADMIN_HOST, SPORTS_DB_ADMIN_USER, SPORTS_DB_ADMIN_PW, SPORTS_DB_ADMIN_PORT,
#              LEAGUEID, ESPN_S2, SWID, ANTHROPIC_API_KEY
#              HEROKU_API_KEY (optional: restart the dyno afterwards so the site shows the new data)
#   variables  SEASON_YEAR, SEASON_START, SEASON_END
#              AWS_ROLE_ARN, MLFLOW_S3_BUCKET, AWS_REGION (optional: back the state up to S3)
#
# State that must survive between runs (MLflow store, cached TFT/DeepAR checkpoints, the injury
# refit stamp, the Claude note-label cache) is carried in the Actions cache, not the repo. GitHub evicts
# a cache entry after 7 days unused (or past 10 GB a repo), so with the AWS variables set it is also
# mirrored to s3://<MLFLOW_S3_BUCKET>/mlflow/runner/ after every run and restored from there whenever the
# cache comes back empty. AWS access is by GitHub OIDC (an IAM role trusted for this repo's main branch):
# no AWS keys are stored anywhere.
name: Nightly pipeline

on:
  schedule:
    # Cron is always UTC (no daylight saving): 15:17 UTC = 7:17 AM PST (Nov-Mar), 8:17 AM PDT (Mar-Nov).
    # Off the top of the hour, GitHub's busiest minute. Scheduled runs are still best-effort: the first
    # 16:00 UTC run (2026-11-16) started 7 h 53 min late.
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      list:
        description: 'small = skip the Yahoo free-agent script, full = include it'
        type: choice
        options: [small, full]
        default: small
      from_s3:
        description: 'Ignore the Actions cache and restore the pipeline state from the S3 backup (to test a restore)'
        type: boolean
        default: false

concurrency:
  group: nightly-pipeline
  cancel-in-progress: false        # never two runs writing the same tables

permissions:
  contents: read
  id-token: write                  # GitHub OIDC: lets the job assume the AWS role (no AWS keys stored)

jobs:
  pipeline:
    # Not ubuntu-latest: that moved to 26.04, which has no prebuilt Python 3.9 for setup-python (3.9 is
    # end-of-life; its builds stop at 24.04). Moving the pipeline env to 3.11 would lift this pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 350           # a TFT/DeepAR retrain day (every 7 days) is the long one
    env:
      # 'true' once the HEROKU_API_KEY secret exists (a missing secret reads as ''). Only this yes/no is
      # job-wide; the key itself is handed to the restart step alone.
      HAS_HEROKU_KEY: ${{ secrets.HEROKU_API_KEY != '' }}
      HAS_AWS: ${{ vars.AWS_ROLE_ARN != '' && vars.MLFLOW_S3_BUCKET != '' }}
      S3_STATE: s3://${{ vars.MLFLOW_S3_BUCKET }}/mlflow/runner     # store/ = mlflow/, state/ = the tmp_data files
    steps:
      - uses: actions/checkout@v4

      # The injury scrape (pro_sports_transactions) runs in its own Python 3.11 venv, like the
      # basketball-prosports-vclaude-env conda env locally.
      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: '3.11'
      - name: Install the injury-scrape venv
        run: |
          ${{ steps.py311.outputs.python-path }} -m venv "$RUNNER_TEMP/prosports"
          "$RUNNER_TEMP/prosports/bin/pip" install -q --disable-pip-version-check \
            pro_sports_transactions==1.1.2 pandas==2.3.3 mysql-connector-python==9.7.0

      # Everything else: Python 3.9, matching basketball-env-useme-v11052026. Set up last so it's `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install pipeline packages
        run: |
          pip install -q --disable-pip-version-check --no-deps torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q --disable-pip-version-check --no-deps -r requirements-pipeline.txt

      # Unflare solves prosportstransactions' Cloudflare challenge (shared/injury_pipeline.py -> localhost:5002).
      - name: Start Unflare
        run: |
          docker run -d --name unflare -p 5002:5002 ghcr.io/iamyegor/unflare
          for i in $(seq 1 45); do
            curl -s -o /dev/null --max-time 3 http://localhost:5002/ && { echo "Unflare up after $((i*2)) s"; exit 0; }
            sleep 2
          done
          echo "Unflare did not answer; run_scripts will retry and skip the injury chain if it still can't"

      - name: Restore pipeline state
        id: state
        if: ${{ !inputs.from_s3 }}
        uses: actions/cache/restore@v4
        with:
          path: |
            mlflow
            tmp_data/injury_probabilities_last_run.txt
            tmp_data/injury_note_llm_cache.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-

      # OIDC credentials last 1 hour, and a TFT/DeepAR retrain day runs ~1.5 h, so they are fetched again
      # before the backup at the end instead of reusing these.
      - name: AWS credentials (for the restore)
        if: env.HAS_AWS == 'true'
        continue-on-error: true        # an AWS problem must not stop the data refresh; the backup step shows it
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      # The cache key is new every run, so cache-hit is always false; cache-matched-key is empty only when
      # nothing was restored at all (evicted, first run, or from_s3).
      - name: Restore pipeline state from S3 (cache was empty)
        if: env.HAS_AWS == 'true' && steps.state.outputs.cache-matched-key == ''
        continue-on-error: true
        run: |
          mkdir -p mlflow tmp_data
          aws s3 sync "$S3_STATE/store/" mlflow/ --only-show-errors
          aws s3 sync "$S3_STATE/state/" tmp_data/ --only-show-errors
          echo "restored from $S3_STATE"

      - name: Check the restored state
        run: |
          if [ -f mlflow/mlflow.db ]; then
            echo "STORE_RESTORED=true" >> "$GITHUB_ENV"
            echo "MLflow store restored: $(du -sh mlflow | cut -f1)"
          else
            echo "STORE_RESTORED=false" >> "$GITHUB_ENV"
            echo "No MLflow store restored: this run starts a new one (and retrains TFT/DeepAR)"
          fi

      - name: Run the pipeline
        env:
          sports_db_admin_host: ${{ secrets.SPORTS_DB_ADMIN_HOST }}
          sports_db_admin_user: ${{ secrets.SPORTS_DB_ADMIN_USER }}
          sports_db_admin_pw: ${{ secrets.SPORTS_DB_ADMIN_PW }}
          sports_db_admin_port: ${{ secrets.SPORTS_DB_ADMIN_PORT }}
          leagueid: ${{ secrets.LEAGUEID }}
          espn_s2: ${{ secrets.ESPN_S2 }}
          swid: ${{ secrets.SWID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          season_year: ${{ vars.SEASON_YEAR }}
          season_start: ${{ vars.SEASON_START }}
          season_end: ${{ vars.SEASON_END }}
          PROSPORTS_PYTHON: ${{ runner.temp }}/prosports/bin/python
          PYTHONUNBUFFERED: '1'
        run: python -m pipeline.run_scripts --list ${{ inputs.list || 'small' }}

      # Drift checks for the injury survival curves: run when the last check is 7+ days old, then the latest
      # results go to the run summary as a "model health" block, with a warning annotation per alert. A drift
      # alert (or a crash here) never fails the data refresh. Runs after a partly failed pipeline too: the
      # data-quality check is what shows a gap.
      - name: Model health (injury curves)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          sports_db_admin_host: ${{ secrets.SPORTS_DB_ADMIN_HOST }}
          sports_db_admin_user: ${{ secrets.SPORTS_DB_ADMIN_USER }}
          sports_db_admin_pw: ${{ secrets.SPORTS_DB_ADMIN_PW }}
          sports_db_admin_port: ${{ secrets.SPORTS_DB_ADMIN_PORT }}
          season_year: ${{ vars.SEASON_YEAR }}
          season_start: ${{ vars.SEASON_START }}
          season_end: ${{ vars.SEASON_END }}
          PYTHONUNBUFFERED: '1'
        run: python -m pipeline.injury_drift_monitor

      # Live drift checks for the points forecasts: logged forecasts scored against the backtest error each
      # run promised, plus bias, 80% coverage, model ranking, chance of playing, input drift and data freshness.
      # Weekly (nightly in a season's first 30 in-season days); the latest results go to the run summary.
      # Never fails the run.
      - name: Model health (points forecasts)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          sports_db_admin_host: ${{ secrets.SPORTS_DB_ADMIN_HOST }}
          sports_db_admin_user: ${{ secrets.SPORTS_DB_ADMIN_USER }}
          sports_db_admin_pw: ${{ secrets.SPORTS_DB_ADMIN_PW }}
          sports_db_admin_port: ${{ secrets.SPORTS_DB_ADMIN_PORT }}
          season_year: ${{ vars.SEASON_YEAR }}
          season_start: ${{ vars.SEASON_START }}
          season_end: ${{ vars.SEASON_END }}
          PYTHONUNBUFFERED: '1'
        run: python -m pipeline.forecast_drift_monitor

      - name: Unflare logs (on failure)
        if: failure()
        run: docker logs --tail 60 unflare || true

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            mlflow
            tmp_data/injury_probabilities_last_run.txt
            tmp_data/injury_note_llm_cache.json
          key: pipeline-state-${{ github.run_id }}

      - name: AWS credentials (for the backup)
        if: ${{ !cancelled() && env.HAS_AWS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      # --delete mirrors what mlflow_retention pruned. It is left off when this run started from an empty
      # store, so a new near-empty store can never wipe the backup (bucket versioning keeps 30 days anyway).
      - name: Back up pipeline state to S3
        if: ${{ !cancelled() && env.HAS_AWS == 'true' }}
        run: |
          [ -f mlflow/mlflow.db ] || { echo 'no MLflow store to back up'; exit 0; }
          DELETE=--delete
          if [ "$STORE_RESTORED" != true ]; then
            DELETE=
            echo 'store started empty this run: uploading without --delete'
          fi
          aws s3 sync mlflow/ "$S3_STATE/store/" $DELETE --only-show-errors
          for f in tmp_data/injury_probabilities_last_run.txt tmp_data/injury_note_llm_cache.json; do
            [ -f "$f" ] && aws s3 cp "$f" "$S3_STATE/state/$(basename "$f")" --only-show-errors
          done
          aws s3 ls "$S3_STATE/" --recursive --summarize --human-readable | tail -2

      # Optional: restart the dyno so the site loads the fresh tables. Runs only once HEROKU_API_KEY exists,
      # and also after a partly failed run (whatever did load is still worth showing), but not a cancelled one.
      # DELETE /apps/<app>/dynos is the Heroku Platform API's "restart all dynos" (same as `heroku restart`).
      - name: Restart the Heroku dyno
        if: ${{ !cancelled() && env.HAS_HEROKU_KEY == 'true' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          curl -sf -X DELETE https://api.heroku.com/apps/fantasy-basketball-team-dash/dynos \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" && echo 'dyno restart requested'
